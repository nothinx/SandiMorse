sentence=Sandi Morse berbahasa Indonesia: kirim teks ke LED/buzzer tanpa delay(), terjemahkan teks dan Morse, dan ubah ketukan tombol menjadi huruf.
paragraph=Pengirim non-blocking dengan kecepatan WPM dan timing standar PARIS, bisa ke pin langsung atau dibaca lewat nyala() untuk tone(), relay, atau layar. Penerjemah teks ke Morse dan sebaliknya dengan buffer tetap. Pembaca ketukan tombol dengan toleransi waktu dan debounce. Huruf, angka, dan tanda baca di PROGMEM. Cocok untuk pramuka, kelas elektronika, dan latihan Morse. English: morse code, CW, encoder, decoder, non-blocking, key, WPM, LED, buzzer.
